<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>
Administrador | DDE Telecom
</title>

<style>

*{
    box-sizing:border-box
}

body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:#eef5f8;
    font-family:Arial;
    color:#123d52
}

.c{
    width:min(
        430px,
        calc(100% - 32px)
    );
    background:#fff;
    padding:34px;
    border-radius:18px;
    box-shadow:
        0 20px 60px
        rgba(3,75,109,.14)
}

h1{
    color:#034b6d
}

.m{
    font-size:30px;
    font-weight:900;
    color:#034b6d
}

label{
    display:block;
    margin:14px 0 6px;
    font-weight:800;
    font-size:13px
}

input{
    width:100%;
    height:48px;
    border:1px solid #cbdce5;
    border-radius:10px;
    padding:0 12px;
    font-size:14px
}

.s{
    position:relative
}

.s input{
    padding-right:84px
}

.s button{
    position:absolute;
    right:7px;
    top:7px;
    height:34px;
    border:0;
    background:transparent;
    color:#034b6d;
    font-weight:800;
    cursor:pointer
}

.e{
    width:100%;
    height:48px;
    border:0;
    border-radius:10px;
    background:#034b6d;
    color:#fff;
    font-weight:900;
    font-size:15px;
    cursor:pointer
}

.msg{
    min-height:20px;
    margin:12px 0;
    font-size:13px
}

</style>

</head>

<body>

<main class="c">

<div class="m">
DDE Telecom
</div>

<h1>
Acesso do Administrador
</h1>

<form id="f">

<label>
E-mail
</label>

<input
    id="email"
    type="email"
    autocomplete="username"
    required
>

<label>
Senha
</label>

<div class="s">

<input
    id="senha"
    type="password"
    autocomplete="current-password"
    required
>

<button
    id="mostrar"
    type="button"
>
Mostrar
</button>

</div>

<p
    id="msg"
    class="msg"
></p>

<button
    class="e"
    type="submit"
>
Entrar
</button>

</form>

</main>

<script src="/admin/login.js?v=1101"></script>

</body>
</html>
