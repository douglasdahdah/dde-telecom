<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>
Login do Vendedor | DDE Telecom
</title>

<link
    rel="stylesheet"
    href="/vendedor/vendedor.css?v=1101"
>

</head>


<body class="login-vendedor-body">


<main class="login-vendedor-card">


    <div class="marca-login">

        <strong>
            DDE
        </strong>

        <span>
            Telecom
        </span>

    </div>


    <span class="etiqueta-login">
        &Aacute;REA COMERCIAL
    </span>


    <h1>
        Acesso do Vendedor
    </h1>


    <p class="descricao-login">
        Entre para acessar os planos DDE Telecom
        e cadastrar os clientes atendidos por voc&ecirc;.
    </p>


    <form id="login-vendedor-form">


        <label for="login-email">
            E-mail
        </label>


        <input
            id="login-email"
            type="email"
            autocomplete="username"
            placeholder="Seu e-mail"
            required
        >


        <label for="login-senha">
            Senha
        </label>


        <div class="campo-senha">

            <input
                id="login-senha"
                type="password"
                autocomplete="current-password"
                placeholder="Sua senha"
                required
            >


            <button
                id="mostrar-senha"
                type="button"
            >
                Mostrar
            </button>

        </div>


        <p
            id="login-mensagem"
            class="login-mensagem"
        ></p>


        <button
            class="botao-entrar"
            type="submit"
        >
            Entrar na &aacute;rea de vendas
        </button>


    </form>


    <small class="rodape-login">
        DDE Telecom ? Gest&atilde;o Comercial
    </small>


</main>


<script src="/vendedor/login.js?v=1101"></script>


</body>

</html>
