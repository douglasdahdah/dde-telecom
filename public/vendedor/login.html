<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | DDE Telecom</title>

    <link
        rel="stylesheet"
        href="/admin/login.css"
    >
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-brand">

                <div class="logo-box">
                    <span class="logo-dde">DDE</span>
                    <span class="logo-telecom">Telecom</span>
                </div>

                <div class="brand-text">

                    <span class="brand-tag">
                        ÁREA DO VENDEDOR
                    </span>

                    <h1>
                        Bem-vindo
                    </h1>

                    <p>
                        Vendedores e indicadores: entre para cadastrar clientes e acompanhar seus leads.
                    </p>

                </div>

            </div>


            <form
                id="loginForm"
                class="login-form"
            >

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@ddetelecom.com.br"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleSenha"
                            class="toggle-password"
                            aria-label="Mostrar senha"
                        >
                            Mostrar
                        </button>

                    </div>

                </div>


                <div
                    id="mensagemLogin"
                    class="login-message"
                    aria-live="polite"
                ></div>


                <button
                    type="submit"
                    id="btnEntrar"
                    class="btn-login"
                >
                    Entrar
                </button>

            </form>


            <div class="login-footer">

                <span>
                    DDE Telecom
                </span>

                <a href="/admin/login.html">Acesso do administrador</a>

            </div>

        </section>

    </main>


    <script src="/vendedor/login.js?v=1101"></script>

</body>

</html>
